<text x="333.0" y="171.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">24Q13 | upper-real / lower-imag</text>
<line x1="600" y1="178" x2="600" y2="195" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="195" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="315" y="195" width="6" height="58" rx="3" fill="#167d74"/>
