<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Algorithm and fixed-point flow</title>
<desc id="desc">Explicit formats, lane boundaries, and RTL-prescribed wrap/truncation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526175"/></marker></defs>
<rect width="1200" height="680" fill="#f8fafc"/>
<text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Algorithm and fixed-point flow</text>
<text x="48" y="82" font-family="Arial, sans-serif" font-size="15" fill="#526175">Explicit formats, lane boundaries, and RTL-prescribed wrap/truncation</text>
<rect x="315" y="120" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="315" y="120" width="6" height="58" rx="3" fill="#2563a6"/>
