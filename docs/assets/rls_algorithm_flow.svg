<rect x="315" y="570" width="6" height="58" rx="3" fill="#b7791f"/>
<text x="333.0" y="597.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">P update</text>
<text x="333.0" y="621.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">36Q29 | rank-1, wrap/truncate</text>
<rect x="48" y="150" width="220" height="105" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="48" y="150" width="6" height="105" rx="3" fill="#2f855a"/>
<text x="66.0" y="177.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Initialization</text>
<text x="66.0" y="201.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">P0 = 8I</text>
<text x="66.0" y="221.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">W0 = 0</text>
<text x="66.0" y="241.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">12 taps</text>
<line x1="268" y1="202" x2="315" y2="202" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="932" y="310" width="220" height="130" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="932" y="310" width="6" height="130" rx="3" fill="#b5413b"/>
<text x="950.0" y="337.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Arithmetic contract</text>
<text x="950.0" y="361.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">two&#x27;s-complement wrap</text>
<text x="950.0" y="381.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">fixed bit slices</text>
<text x="950.0" y="401.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">no saturation</text>
<text x="950.0" y="421.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">RTL_OBSERVED_A0</text>
<line x1="885" y1="374" x2="932" y2="374" stroke="#526175" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
</svg>
