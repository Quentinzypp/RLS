<text x="333.0" y="372.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Reciprocal / K</text>
<text x="333.0" y="396.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">24Q20 | Radix-4 Q32 -&gt; slice</text>
<line x1="600" y1="403" x2="600" y2="420" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="420" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="315" y="420" width="6" height="58" rx="3" fill="#2563a6"/>
<text x="333.0" y="447.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Y and E</text>
<text x="333.0" y="471.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">36Q25 | E = D - Y</text>
<line x1="600" y1="478" x2="600" y2="495" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="495" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="315" y="495" width="6" height="58" rx="3" fill="#167d74"/>
<text x="333.0" y="522.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">W update</text>
<text x="333.0" y="546.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">36Q27 | 12 complex taps</text>
<line x1="600" y1="553" x2="600" y2="570" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
