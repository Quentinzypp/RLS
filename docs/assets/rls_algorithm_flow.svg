<text x="333.0" y="246.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">P: 36Q29 | 40-bit/component sum</text>
<line x1="600" y1="253" x2="600" y2="270" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="270" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="315" y="270" width="6" height="58" rx="3" fill="#b7791f"/>
<text x="333.0" y="297.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Denominator</text>
<text x="333.0" y="321.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">34Q25 | lambda + u^H P u</text>
<line x1="600" y1="328" x2="600" y2="345" stroke="#526175" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="345" width="570" height="58" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
