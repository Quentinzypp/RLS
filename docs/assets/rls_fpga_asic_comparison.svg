<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">FPGA and ASIC evidence are different quantities</title>
<desc id="desc">Do not convert LUT/FF/BRAM/DSP into standard-cell area/SRAM/STA</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526175"/></marker></defs>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">FPGA and ASIC evidence are different quantities</text>
<text x="48" y="82" font-family="Arial, sans-serif" font-size="15" fill="#526175">Do not convert LUT/FF/BRAM/DSP into standard-cell area/SRAM/STA</text>
<rect x="55" y="130" width="440" height="315" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="55" y="130" width="6" height="315" rx="3" fill="#2563a6"/>
<text x="73.0" y="157.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">FPGA prototype | accepted baseline</text>
<text x="73.0" y="181.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">Vivado 2024.2</text>
<text x="73.0" y="201.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">21,535 LUT</text>
<text x="73.0" y="221.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">42,855 registers</text>
<text x="73.0" y="241.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">103 BRAM Tile</text>
<text x="73.0" y="261.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">352 DSP48E2</text>
<text x="73.0" y="281.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">65.104 ns constraint</text>
<text x="73.0" y="301.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">WNS +55.532 ns | TNS 0</text>
<text x="73.0" y="321.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">hold +0.010 ns</text>
<rect x="705" y="130" width="440" height="315" rx="7" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.5"/>
<rect x="705" y="130" width="6" height="315" rx="3" fill="#167d74"/>
<text x="723.0" y="157.0" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">ASIC portable RTL | frontend diagnosis</text>
<text x="723.0" y="181.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">Design Compiler</text>
<text x="723.0" y="201.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">standard-cell logic area</text>
<text x="723.0" y="221.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">18 SRAM wrappers / 3,257,856 bits</text>
<text x="723.0" y="241.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">top 10 ns WNS -0.09 ns</text>
<text x="723.0" y="261.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">SRAM PPA NOT_AVAILABLE</text>
<text x="723.0" y="281.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">power NOT_EVALUABLE</text>
<text x="723.0" y="301.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">pre-layout, typical-only</text>
<text x="723.0" y="321.0" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#526175">not signoff</text>
<text x="600.0" y="250.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b5413b">not equal</text>
<line x1="535" y1="276" x2="665" y2="276" stroke="#b5413b" stroke-width="4"/>
<line x1="535" y1="292" x2="665" y2="292" stroke="#b5413b" stroke-width="4"/>
<line x1="650" y1="254" x2="550" y2="314" stroke="#b5413b" stroke-width="4"/>
<rect x="55" y="490" width="1090" height="78" rx="7" fill="#fef3c7" stroke="#ead18b"/>
<text x="600.0" y="520.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">New Vivado original/divopt comparison: IN PROGRESS / EXCLUDED</text>
<text x="600.0" y="548.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#526175">Only the previous accepted FPGA baseline is published</text>
